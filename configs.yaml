# =============================================================================
# configs.yaml — SAP ERP AI Agent 중앙 설정 파일
#
# 규칙:
#   - 코드 동작을 제어하는 모든 설정은 이 파일에서 관리합니다.
#   - 민감한 비밀값 (API 키, Webhook URL 등)은 .env 파일에 유지합니다.
#   - 환경별 오버라이드는 YAML 값 수정 또는 .env 변수 추가로 처리합니다.
# =============================================================================

# ── OpenRouter (클라우드 LLM 서버) ───────────────────────────────────────────
openrouter:
  base_url: "https://openrouter.ai/api/v1"

# ── 노드별 모델 설정 ─────────────────────────────────────────────────────────
models:
  preprocessor:
    # LangGraph 진입 전 이메일 전처리(발신자/수신자/요청 사항/엔티티 구조화) 전용.
    # 구조화 추출 태스크라 worker_a와 같은 gpt-4o-mini가 안정적.
    name: "openai/gpt-4o-mini"
    provider: "openrouter"
    temperature: 0.0
  router:
    name: "deepseek/deepseek-v4-flash"               # 분류(3-class) — 저비용·강추론 실험
    provider: "openrouter"                          # ollama | openrouter
    temperature: 0.0          # 분류 태스크 → 결정론적 출력
  worker_a:
    name: "openai/gpt-4o-mini"                     # 파라미터 추출 LLM
    provider: "openrouter"
    temperature: 0.0
  worker_a_sql:
    # Text-to-SQL은 스키마 + 복잡한 JOIN/aggregation/CAST 규칙을 동시에 지켜야 함.
    # 1차 선택: deepseek-chat-v3 (코드/SQL 특화, 비용 저렴)
    # 효과가 부족하면 anthropic/claude-haiku-4.5로 승급 검토.
    name: "deepseek/deepseek-chat-v3"              # Text-to-SQL 전용
    provider: "openrouter"
    temperature: 0.0
  worker_b:
    name: "openai/gpt-4o-mini"   # RAG 답변 생성 LLM
    provider: "openrouter"
    temperature: 0.1
  synthesizer:
    name: "google/gemini-3.1-flash-lite"  # Phase 6: email synthesis LLM
    provider: "openrouter"
    temperature: 0.3
  data_gen:
    name: "deepseek/deepseek-v4-flash"     # src/data/ 데이터셋 생성 전용 모델
    provider: "openrouter"
    temperature: 0.5
  eval_judge:
    name: "openai/gpt-4o-mini"  # 평가 채점(LLM Judge) 전용 모델
    provider: "openrouter"
    temperature: 0.0


# ── 데이터 경로 ──────────────────────────────────────────────────────────────
paths:
  erp_db: "data/sap_erp.db"
  checkpoint_db: "data/checkpoints.db"
  chroma_db: "./chroma_db"
  docs_dir: "data/docs"
  eval_test_cases: "data/eval/router_test_cases_gen.json"
  reports_dir: "reports"

# ── 로깅 ─────────────────────────────────────────────────────────────────────
logging:
  level: "DEBUG"              # 파일 저장 레벨 (DEBUG / INFO / WARNING)
  console_level: "INFO"       # 터미널 출력 레벨
  dir: "logs"                 # 로그 디렉토리 (프로젝트 루트 기준 상대 경로)
  max_bytes: 10485760         # 로그 파일 최대 크기 (10 MB)
  backup_count: 5             # 최대 백업 파일 수

# ── RAG 설정 ─────────────────────────────────────────────────────────────────
rag:
  chunk_size: 512
  chunk_overlap: 128
  collection_name: "sap_manuals"
  dense_weight: 0.5           # ChromaDB 시맨틱 검색 가중치
  sparse_weight: 0.5          # BM25 키워드 검색 가중치
  top_k_retrieval: 8          # Retriever 후보 수 (스윕 결과 8=20과 동일 품질, 리랭크 비용 ↓)
  top_k_rerank: 5             # Reranker 최종 선별 수
  contextual_header: true     # 청크 본문 앞에 [Source: 문서명 | p.N] 헤더를 붙여 임베딩 (재인제스트 필요)
  ocr_enabled: true           # PDF 내 이미지 페이지에 Surya OCR 적용해 별도 OCR 청크 생성 (재인제스트 필요)
  rerank_blend_alpha: 0.8     # 리랭크 점수 블렌딩: final=alpha*cross_encoder+(1-alpha)*검색순위. 1.0=순수 리랭커, 낮출수록 검색(dense/BM25) 신호 보존. (hit/ndcg/mrr 동시 스윕 결과 0.8이 전 지표 최적)
  meta_boost_beta: 0.0        # 메타 소프트 부스트: final += beta*(쿼리↔unit/lesson/section 토큰 일치). 0=비활성. (β 스윕으로 튜닝)

# ── Feature Flags ─────────────────────────────────────────────────────────────
feature_flags:
  human_in_the_loop: true     # false로 변경 시 Slack 승인 스킵 (개발용)
